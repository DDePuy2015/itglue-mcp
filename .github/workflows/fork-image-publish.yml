name: Fork Image Publish (ACR only)

# Deliberate publication only. No push/PR trigger and no Container Apps commands.
# Source/image gates build and scan once without Azure credentials. This job
# transfers those exact OCI bytes, then signs and verifies the immutable digest.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main SHA selected for this dispatch (must equal the workflow SHA)
        required: true
        type: string
      acr_login_server:
        description: Only summititmcpacr.azurecr.io is allowed
        required: true
        default: summititmcpacr.azurecr.io
        type: string
      image_repository:
        description: Only itglue-mcp is allowed
        required: true
        default: itglue-mcp
        type: string
      release_confirmation:
        description: Confirm intentional publication of the selected main commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: itglue-acr-publish
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  ACR_LOGIN_SERVER: ${{ inputs.acr_login_server }}
  IMAGE_REPOSITORY: ${{ inputs.image_repository }}
  RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}

jobs:
  guard:
    name: Confirm Summit ACR publisher
    runs-on: ubuntu-latest
    steps:
      - name: Reject unapproved source before checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = DDePuy2015/itglue-mcp
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$RELEASE_CONFIRMATION" = true
          test "$ACR_LOGIN_SERVER" = summititmcpacr.azurecr.io
          test "$IMAGE_REPOSITORY" = itglue-mcp

      - name: Checkout dispatched main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify approved publication inputs
        run: node scripts/release-checks.mjs guard

  validate:
    name: Re-run source and runtime gates
    needs: guard
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/fork-container-validation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      image_tag: itglue-mcp:publish-${{ inputs.source_sha }}

  publish:
    name: Publish, sign and verify scanned ACR digest
    needs: [guard, validate]
    if: needs.guard.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
      IMAGE_TAG: sha-${{ inputs.source_sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
      EVIDENCE: /tmp/itglue-evidence
    steps:
      - name: Checkout dispatched main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and inputs again before credential use
        run: |
          set -euo pipefail
          node scripts/release-checks.mjs guard
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Download same-run scanned image and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: ${{ env.EVIDENCE }}

      - name: Verify exact scanned archive before Azure login
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/oci"
          tar -xf "$EVIDENCE/image.tar" -C "$RUNNER_TEMP/oci"
          node scripts/release-checks.mjs oci "$RUNNER_TEMP/oci" "$EVIDENCE"
          sudo apt-get update -qq
          sudo apt-get install -y skopeo

      - name: Require existing workload identity configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for setting in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if test -z "${!setting}"; then
              echo "Missing publisher prerequisite: $setting (see docs/IMAGE_PUBLISHING.md)" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with repository workload identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse tag reuse and ambiguous registry access
        run: |
          set -euo pipefail
          az acr repository show-tags --name summititmcpacr --repository "$IMAGE_REPOSITORY" --output json > "$RUNNER_TEMP/existing-tags.json"
          jq -e --arg tag "$IMAGE_TAG" 'type == "array" and index($tag) == null' "$RUNNER_TEMP/existing-tags.json"

      - name: Sign in to fixed Summit ACR
        run: |
          set -euo pipefail
          acr_token="$(az acr login --name summititmcpacr --expose-token --query accessToken --output tsv)"
          test -n "$acr_token"
          echo "::add-mask::$acr_token"
          printf '%s' "$acr_token" | skopeo login --authfile "$RUNNER_TEMP/acr-auth.json" "$ACR_LOGIN_SERVER" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          printf '%s' "$acr_token" | docker login "$ACR_LOGIN_SERVER" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          unset acr_token

      - name: Push the scanned OCI index without rebuilding
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/acr-auth.json" --digestfile "$RUNNER_TEMP/published-digest.txt" "oci-archive:$EVIDENCE/image.tar" "docker://$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$IMAGE_TAG"
          test "$(cat "$RUNNER_TEMP/published-digest.txt")" = "$IMAGE_DIGEST"
          echo "IMAGE_REF=$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Verify registry bytes match the scanned OCI index
        run: |
          set -euo pipefail
          skopeo inspect --raw --authfile "$RUNNER_TEMP/acr-auth.json" "docker://$IMAGE_REF" > "$RUNNER_TEMP/registry-index.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/registry-index.json" | cut -d ' ' -f 1)" = "$IMAGE_DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign exact digest and attest validated SBOM and BuildKit provenance
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --predicate "$EVIDENCE/image-sbom.cdx.json" --type https://cyclonedx.org/bom "$IMAGE_REF"
          cosign attest --yes --predicate "$EVIDENCE/verified-provenance.json" --type https://slsa.dev/provenance/v0.2 "$IMAGE_REF"

      - name: Verify exact signing identity, digest and signed predicates
        env:
          SIGNER_IDENTITY: https://github.com/DDePuy2015/itglue-mcp/.github/workflows/fork-image-publish.yml@refs/heads/main
          DIGEST: ${{ needs.validate.outputs.image_digest }}
        run: |
          set -euo pipefail
          issuer=https://token.actions.githubusercontent.com
          cosign verify "$IMAGE_REF" --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$issuer" > "$EVIDENCE/signature-verification.json"
          cosign verify-attestation "$IMAGE_REF" --type https://cyclonedx.org/bom --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$issuer" > "$EVIDENCE/sbom-verification.json"
          cosign verify-attestation "$IMAGE_REF" --type https://slsa.dev/provenance/v0.2 --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$issuer" > "$EVIDENCE/provenance-verification.json"
          node scripts/release-checks.mjs signed-sbom "$EVIDENCE/sbom-verification.json" "$EVIDENCE/image-sbom.cdx.json"
          node scripts/release-checks.mjs signed-provenance "$EVIDENCE/provenance-verification.json" "$EVIDENCE/verified-provenance.json"
          jq --arg tag "$IMAGE_TAG" --arg ref "$IMAGE_REF" --arg run "$GITHUB_RUN_ID" '. + {tag: $tag, image: $ref, runId: $run, signatureVerified: true, sbomVerified: true, provenanceVerified: true}' "$EVIDENCE/image-metadata.json" > "$EVIDENCE/published-metadata.json"

      - name: Retain immutable publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: itglue-publication-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/*.json
          if-no-files-found: warn

      - name: Clear temporary registry credentials
        if: always()
        run: |
          docker logout summititmcpacr.azurecr.io || true
          rm -f "$RUNNER_TEMP/acr-auth.json"
