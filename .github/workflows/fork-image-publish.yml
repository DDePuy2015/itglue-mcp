name: Fork Image Publish (GHCR only)

# This workflow is intentionally manual and is not part of PR validation.
# It has no release, tag, npm-publish, MCP Registry, OIDC, Azure deployment, or
# upstream-namespace step. The exact source commit must already be reachable
# from Summit fork main, and the exact image tag is commit-derived.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 40-character merged-main commit SHA to build exactly
        required: true
        type: string
      image_tag:
        description: Immutable image tag; must be sha-<40-character source SHA>
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH_DDEPUY2015_ITGLUE_MCP to enable GHCR push
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: fork-image-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ddepuy2015/itglue-mcp

jobs:
  guard:
    name: Confirm Summit fork publisher
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository, ref, and publish confirmation
        shell: bash
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "DDePuy2015/itglue-mcp"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_PUBLISH" = "PUBLISH_DDEPUY2015_ITGLUE_MCP"
          echo "Manual GHCR-only publication is authorized for this run."

  validate:
    name: Re-run source and runtime gates
    needs: guard
    uses: ./.github/workflows/fork-container-validation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      image_tag: itglue-mcp:publish-${{ inputs.source_sha }}

  publish:
    name: Build and push linux/amd64 image to fork GHCR
    needs: [guard, validate]
    if: needs.guard.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source and tag inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$IMAGE_TAG" = "sha-$SOURCE_SHA"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo "Building merged Summit source commit: $actual_sha"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to fork GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable linux/amd64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/DDePuy2015/itglue-mcp
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          sbom: true
          provenance: mode=max

      - name: Scan published image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Report immutable image and attestations
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          echo "Published immutable reference: $IMAGE@$DIGEST"
          echo "BuildKit SBOM and max-mode provenance were requested for this digest."
