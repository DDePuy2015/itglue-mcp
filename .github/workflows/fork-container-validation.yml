name: Fork Container Validation

# PR/main checks have read-only credentials. The manual publisher consumes the
# same scanned OCI archive; validation never pushes to a registry or deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        description: 40-character source commit to validate
        required: false
        type: string
      image_tag:
        description: Local-only image tag used for runtime validation
        required: false
        type: string
    outputs:
      image_digest:
        description: Digest of the scanned attested OCI index
        value: ${{ jobs.validate.outputs.image_digest }}
      artifact_name:
        description: Same-run artifact containing the scanned image and evidence
        value: ${{ jobs.validate.outputs.artifact_name }}

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate source and runtime image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      artifact_name: ${{ steps.evidence.outputs.artifact_name }}
    env:
      EXPECTED_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      LOCAL_IMAGE: ${{ inputs.image_tag || format('itglue-mcp:{0}', github.sha) }}
      EVIDENCE: /tmp/itglue-evidence

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source pin and clean tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node --test scripts/release-checks.test.mjs
          git diff --check

      - name: Run production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Scan tracked source for secrets
        id: source-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: node_modules,dist,.git
          format: json
          output: ${{ runner.temp }}/source-scan.json
          exit-code: '1'

      - name: Retain sanitized source scan and enforce policy
        if: ${{ always() && steps.source-scan.outcome != 'skipped' }}
        env:
          SCAN_OUTCOME: ${{ steps.source-scan.outcome }}
        run: |
          set -euo pipefail
          node scripts/release-checks.mjs scan-summary "$RUNNER_TEMP/source-scan.json" "$EVIDENCE/source-scan-summary.json"
          test "$SCAN_OUTCOME" = success

      - name: Generate CycloneDX source SBOM
        run: |
          set -euo pipefail
          # Record the complete installed build graph and enforce production
          # coverage rather than accepting an empty inventory from an omit filter.
          npm sbom --sbom-format cyclonedx > "$EVIDENCE/source-sbom.cdx.json"
          node scripts/release-checks.mjs source-sbom "$EVIDENCE/source-sbom.cdx.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build attested OCI archive without pushing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ env.EVIDENCE }}/image.tar
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/DDePuy2015/itglue-mcp
            org.opencontainers.image.revision=${{ env.EXPECTED_SHA }}
          sbom: true
          provenance: mode=max,version=v0.2

      - name: Verify archive, provenance and image source
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/oci"
          tar -xf "$EVIDENCE/image.tar" -C "$RUNNER_TEMP/oci"
          node scripts/release-checks.mjs oci "$RUNNER_TEMP/oci" "$EVIDENCE"

      - name: Load the same archive for runtime and vulnerability checks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          # Exercise the publisher's all-manifest transfer locally, with no
          # registry credentials or writes, before loading the runnable image.
          skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/transfer-digest.txt" "oci-archive:$EVIDENCE/image.tar" "oci:$RUNNER_TEMP/transfer-check:validated"
          test "$(cat "$RUNNER_TEMP/transfer-digest.txt")" = "$(jq -r .digest "$EVIDENCE/image-metadata.json")"
          skopeo --override-os linux --override-arch amd64 copy "oci-archive:$EVIDENCE/image.tar" "docker-daemon:$LOCAL_IMAGE"
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')" = "$(jq -r .configDigest "$EVIDENCE/image-metadata.json")"

      - name: Scan exact local image for vulnerabilities and secrets
        id: image-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: ${{ runner.temp }}/image-scan.json
          exit-code: '1'

      - name: Retain sanitized image scan and enforce policy
        if: ${{ always() && steps.image-scan.outcome != 'skipped' }}
        env:
          SCAN_OUTCOME: ${{ steps.image-scan.outcome }}
        run: |
          set -euo pipefail
          node scripts/release-checks.mjs scan-summary "$RUNNER_TEMP/image-scan.json" "$EVIDENCE/image-scan-summary.json"
          test "$SCAN_OUTCOME" = success

      - name: Generate exact image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx
          output: ${{ env.EVIDENCE }}/image-sbom.cdx.json

      - name: Verify image runtime alignment
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE" | jq -e '.[0] | .Architecture == "amd64" and .Config.Cmd == ["node", "dist/index.js"] and .Config.Entrypoint == ["docker-entrypoint.sh"] and .Config.User == "mcp"'
          runtime="$(docker run --rm --platform linux/amd64 --entrypoint node "$LOCAL_IMAGE" -e 'process.stdout.write(process.platform + "/" + process.arch)')"
          test "$runtime" = linux/x64
          node_version="$(docker run --rm --platform linux/amd64 --entrypoint node "$LOCAL_IMAGE" -e 'process.stdout.write(process.versions.node)')"
          [[ "$node_version" =~ ^26\. ]]
          echo "Validated image runtime: $runtime, Node $node_version, user mcp, command node dist/index.js"

      - name: Retain automatic validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: itglue-validation-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/*.json
          if-no-files-found: warn

      - name: Name scanned publication artifact
        id: evidence
        if: ${{ inputs.source_sha != '' }}
        run: echo "artifact_name=itglue-scanned-image-$EXPECTED_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Retain exact scanned image for manual publication
        if: ${{ inputs.source_sha != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
