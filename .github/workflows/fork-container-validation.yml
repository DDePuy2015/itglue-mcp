name: Fork Container Validation

# Read-only validation for the Summit fork. This workflow deliberately does
# not create a release, publish to the MCP Registry, push an image, or deploy
# to Azure. It is also callable by the manual publisher so the exact source
# checks and runtime gates run before a GHCR push.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        description: 40-character source commit to validate
        required: false
        type: string
      image_tag:
        description: Local-only image tag used for runtime validation
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate source and runtime image
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      LOCAL_IMAGE: ${{ inputs.image_tag || format('itglue-mcp:pr-{0}', github.event.pull_request.number) }}
      NODE_AUTH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source pin and clean tree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "Validated source commit: $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git diff --check

      - name: Run dependency and source secret scans
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          if git grep -nEI -e '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|(^|[^A-Za-z])(ghp_|github_pat_|glpat-|xox[baprs]-|AKIA|ASIA)[A-Za-z0-9_-]{10,}' -- ':!package-lock.json'; then
            echo "Potential credential material found in tracked source." >&2
            exit 1
          fi

      - name: Generate CycloneDX source SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --omit=dev > "$RUNNER_TEMP/itglue-source-sbom.cdx.json"
          test -s "$RUNNER_TEMP/itglue-source-sbom.cdx.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/DDePuy2015/itglue-mcp
            org.opencontainers.image.revision=${{ env.EXPECTED_SHA }}
          # The local Docker exporter cannot load a manifest list with
          # attestations; the manual publisher attaches SBOM/provenance to the
          # pushed digest after these same source gates pass.

      - name: Scan local image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify image runtime alignment
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(docker image inspect "$LOCAL_IMAGE")"
          echo "$metadata" | jq -e '
            .[0]
            | .Architecture == "amd64"
              and .Config.Cmd == ["node", "dist/index.js"]
              and .Config.Entrypoint == null
              and .Config.User == "mcp"
          '
          runtime="$(docker run --rm --platform linux/amd64 --entrypoint node "$LOCAL_IMAGE" -e 'process.stdout.write(process.platform + "/" + process.arch)')"
          test "$runtime" = "linux/x64"
          node_version="$(docker run --rm --platform linux/amd64 --entrypoint node "$LOCAL_IMAGE" -e 'process.stdout.write(process.versions.node)')"
          [[ "$node_version" =~ ^26\. ]]
          echo "Validated image runtime: $runtime, Node $node_version, user mcp, command node dist/index.js"
