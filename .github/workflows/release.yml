name: Release

on:
  pull_request:
    branches: [main]

# Fork safety guard. The inherited upstream caller could semantic-release,
# publish to the upstream GHCR namespace and MCP Registry through OIDC, and
# upload security results. This fork keeps PR verification read-only; the
# Summit-owned image path is available only through the separately reviewed,
# manually confirmed ACR publisher.
permissions:
  contents: read

jobs:
  fork-release-guard:
    name: Fork release disabled
    runs-on: ubuntu-latest
    steps:
      - name: Confirm fork release guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "DDePuy2015/itglue-mcp"
          echo "Upstream release, MCP Registry publication, OIDC, and automatic image publishing are disabled for this Summit fork."
          echo "PR validation runs in fork-container-validation.yml; image publication requires the manual ACR workflow."
